<style>
/* Layout: one committed black-and-gold world taken from the KO monogram. Full-bleed type, hairline grids, pinned scroll scenes. */
:root{
  --ink:#0B0A08; --ink-2:#12100D; --ink-3:#1A1713;
  --bone:#ECE4D4; --dim:#8E8676; --line:rgba(236,228,212,.12); --line-2:rgba(236,228,212,.22);
  --gold:#C99A52; --gold-hi:#EBC98C;
  --wide:"Archivo","Helvetica Neue",Arial,sans-serif;
  --serif:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --ar:"Tajawal","Segoe UI",Tahoma,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --gx:max(20px,env(safe-area-inset-left,0px));
  --gy:max(20px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html{overflow-x:clip}
[hidden]{display:none!important}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:hidden}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--wide);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip}
html[dir="rtl"] body{font-family:var(--ar)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
::selection{background:var(--gold);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
.gut{padding-left:var(--gx);padding-right:var(--gy)}
.cap{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;font-stretch:110%}
html[dir="rtl"] .cap{letter-spacing:0;font-size:14px}
.dim{color:var(--dim)}
.it{font-family:var(--serif);font-style:italic;font-weight:400;text-transform:none;letter-spacing:-.01em;font-stretch:100%}
html[dir="rtl"] .it{font-family:var(--ar);font-style:normal;color:var(--gold)}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}
.ulink{position:relative;display:inline-block}
.ulink::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .5s var(--ease)}
.ulink:hover::after,.ulink.on::after{transform:scaleX(1);transform-origin:left}

/* buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:14px;height:54px;padding:0 28px;border:1px solid var(--bone);border-radius:999px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;font-stretch:112%;overflow:hidden;isolation:isolate;transition:color .45s var(--ease),border-color .45s}
html[dir="rtl"] .btn{letter-spacing:0;font-size:15px}
.btn::before{content:"";position:absolute;inset:0;background:var(--bone);border-radius:inherit;transform:translateY(101%);transition:transform .55s var(--ease);z-index:-1}
.btn:hover{color:var(--ink)}
.btn:hover::before{transform:none}
.btn.solid{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn.solid::before{background:var(--bone)}
.btn.full{width:100%}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn .arr{display:inline-block;transition:transform .45s var(--ease)}
.btn:hover .arr{transform:translateX(4px)}
html[dir="rtl"] .arr{transform:scaleX(-1)}
html[dir="rtl"] .btn:hover .arr{transform:scaleX(-1) translateX(4px)}

/* ko monogram */
.ko{display:block;overflow:visible}
.ko use{fill:url(#koGold)}

/* preloader */
#pre{position:fixed;inset:0;z-index:200;background:var(--ink);display:grid;place-items:center}
#pre .ko{width:min(220px,46vw);height:auto}
#pre .ko use{fill:url(#koGold);fill-opacity:0;stroke:var(--gold);stroke-width:7;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s var(--ease) forwards,fillin .6s .9s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillin{to{fill-opacity:1;stroke-width:0}}
#pre .pc{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:var(--gx);right:var(--gy);display:flex;justify-content:space-between}
#pre .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--gold);width:0}


/* header */
#hd{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;transition:transform .6s var(--ease),background .4s,border-color .4s;border-bottom:1px solid transparent}
#hd.solid{background:rgba(11,10,8,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-color:var(--line)}
#hd.away{transform:translateY(-110%)}
.hrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:76px}
.brand{display:flex;align-items:center;gap:12px}
.brand .ko{width:34px;height:auto}
.brand b{font-weight:800;font-stretch:125%;letter-spacing:.08em;font-size:14px}
.hnav{display:flex;gap:30px}
.hnav button{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;font-stretch:110%;color:var(--dim);transition:color .3s}
html[dir="rtl"] .hnav button{letter-spacing:0;font-size:15px}
.hnav button:hover,.hnav button.on{color:var(--bone)}
.hact{display:flex;gap:22px;justify-content:flex-end;align-items:center}
.hact button{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;font-stretch:110%}
html[dir="rtl"] .hact button{letter-spacing:0;font-size:15px}
.bagn{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--gold);color:var(--ink);font-size:11px;font-weight:700;margin-inline-start:6px;padding:0 6px}
.menu-btn{display:none}
@media (max-width:1020px){.hnav{display:none}.hrow{grid-template-columns:1fr auto}.menu-btn{display:inline}}
@media (max-width:520px){.brand b{display:none}.hact{gap:16px}}

/* mobile menu */
#menu{position:fixed;inset:0;z-index:45;background:var(--ink);padding:calc(env(safe-area-inset-top,0px) + 100px) var(--gy) 40px var(--gx);display:flex;flex-direction:column;gap:6px;clip-path:inset(0 0 100% 0);transition:clip-path .8s var(--ease);visibility:hidden}
#menu.open{clip-path:inset(0);visibility:visible}
#menu button{font-size:clamp(38px,11vw,64px);font-weight:800;font-stretch:125%;text-transform:uppercase;line-height:1.05;text-align:start}
html[dir="rtl"] #menu button{font-weight:800}

/* hero */
#hero{position:relative;min-height:max(640px,min(100svh,1000px));display:flex;flex-direction:column;justify-content:space-between;padding-top:calc(env(safe-area-inset-top,0px) + 110px);padding-bottom:28px;overflow:hidden}
.glow{position:absolute;left:50%;top:44%;width:min(900px,120vw);aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(201,154,82,.22),rgba(201,154,82,.06) 55%,transparent);pointer-events:none}
.htop{position:relative;display:flex;justify-content:space-between;gap:24px;z-index:2}
.htop p{margin:0;max-width:28ch;font-size:15px;color:var(--dim)}
.htop .r{text-align:end}
.wall{position:absolute;inset:-30% -12% -30% -12%;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;transform:perspective(1600px) rotateX(22deg) rotateZ(-9deg);transform-origin:50% 40%;z-index:0}
.wcol{display:flex;flex-direction:column;gap:14px;animation:wup 70s linear infinite;will-change:transform}
.wcol:nth-child(even){animation-name:wdown;animation-duration:85s}
@keyframes wup{to{transform:translateY(-50%)}}
@keyframes wdown{from{transform:translateY(-50%)}to{transform:translateY(0)}}
.wt{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--ink-2);cursor:pointer}
.wt img{width:100%;height:100%;object-fit:cover;filter:grayscale(.45) brightness(.62) contrast(1.05);transition:filter .6s,transform 1s var(--ease)}
.wt:hover img{filter:none;transform:scale(1.06)}
.hveil{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(48% 42% at 50% 48%,rgba(11,10,8,.92),rgba(11,10,8,.55) 62%,rgba(11,10,8,.15) 100%),linear-gradient(to top,var(--ink) 4%,transparent 38%),linear-gradient(to bottom,var(--ink),transparent 22%)}
.hmono{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:2;width:min(300px,52vw);pointer-events:none;filter:drop-shadow(0 0 40px rgba(201,154,82,.35))}
.hmono .ko{width:100%;height:auto}
@media (max-width:760px){.hveil{background:radial-gradient(70% 34% at 50% 46%,rgba(11,10,8,.9),rgba(11,10,8,.5) 70%,rgba(11,10,8,.25)),linear-gradient(to top,var(--ink) 8%,transparent 40%),linear-gradient(to bottom,var(--ink) 18%,transparent 42%)}.word{font-size:clamp(56px,14.5vw,268px)}.wall{grid-template-columns:repeat(3,minmax(0,1fr));inset:-20% -30%}.wcol:nth-child(n+4){display:none}}
@keyframes float{50%{transform:translateY(-14px) rotate(-1deg)}}
.word{direction:ltr;position:relative;z-index:2;font-weight:900;font-stretch:125%;text-transform:uppercase;line-height:.78;font-size:clamp(64px,15.6vw,268px);letter-spacing:-.02em;white-space:nowrap;display:flex;justify-content:space-between;margin:0}
.word .c{display:inline-block;will-change:transform}
.word .sp{width:.3em;flex:none}
.hbot{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-top:22px}
.scue{display:flex;align-items:center;gap:12px}
.scue i{display:block;width:60px;height:1px;background:var(--line-2);position:relative;overflow:hidden}
.scue i::after{content:"";position:absolute;inset:0;background:var(--gold);animation:cue 2.2s var(--ease) infinite}
@keyframes cue{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
@media (max-width:700px){.hbot .btn{height:46px;padding:0 18px;font-size:12px}.htop{flex-direction:column}.htop .r{text-align:start}}

/* marquee */
.mq{border-block:1px solid var(--line);overflow:hidden;padding-block:22px;white-space:nowrap}
.mq .tr{display:inline-flex;will-change:transform}
.mq span{font-size:clamp(28px,4vw,52px);font-weight:300;font-stretch:125%;text-transform:uppercase;padding-inline:28px;display:inline-flex;align-items:center;gap:56px}
.mq span::after{content:"";width:12px;height:12px;border:1.5px solid var(--gold);border-radius:50%;flex:none}

/* statement */
#statement{padding-block:clamp(90px,14vw,190px)}
.stmt{font-size:clamp(30px,4.6vw,72px);line-height:1.08;font-weight:500;font-stretch:108%;letter-spacing:-.015em;max-width:21ch;margin:0;text-wrap:balance}
html[dir="rtl"] .stmt{line-height:1.35;font-weight:700}
.stmt .w{opacity:.2;transition:opacity .2s}
.stmt .it{color:var(--gold)}
.srow{display:grid;grid-template-columns:1fr 2.4fr;gap:40px}
@media (max-width:820px){.srow{grid-template-columns:1fr;gap:24px}}

/* drop (pinned horizontal) */
#drop{position:relative;overflow:hidden}
.dhead{display:flex;justify-content:space-between;align-items:flex-end;padding-top:26px}
.dhead h2{margin:0;font-size:clamp(46px,7.6vw,128px);font-weight:900;font-stretch:125%;text-transform:uppercase;line-height:.85;letter-spacing:-.02em}
.dtrack{display:flex;gap:2vw;padding-block:40px 60px;will-change:transform;width:max-content}
.slide{position:relative;width:min(560px,78vw);flex:none;display:flex;flex-direction:column;gap:18px}
.slide .stage{position:relative;aspect-ratio:1/1.05;background:var(--ink-2);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;cursor:pointer}
.slide .idx{position:absolute;top:-.08em;inset-inline-start:.04em;font-size:clamp(150px,21vw,300px);font-weight:900;font-stretch:125%;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(236,228,212,.13);pointer-events:none}
.slide .stage img{position:relative;width:84%;transition:transform 1s var(--ease);filter:drop-shadow(0 34px 30px rgba(0,0,0,.6))}
.slide .stage:hover img{transform:scale(1.06) rotate(-3deg)}
.slide .meta{display:flex;justify-content:space-between;gap:16px;align-items:baseline}
.slide .meta b{font-size:19px;font-weight:600}
.dprog{height:1px;background:var(--line);position:relative;margin-bottom:28px}
.dprog i{position:absolute;inset:0 auto 0 0;width:0;background:var(--gold)}
html[dir="rtl"] .dprog i{inset:0 0 0 auto}
@media (max-width:820px){#drop .dtrack{overflow-x:auto;width:auto;scroll-snap-type:x mandatory;padding-inline:var(--gx)}#drop .slide{scroll-snap-align:start}#drop .dtrack::-webkit-scrollbar{display:none}}

/* categories list */
#cats{padding-block:clamp(80px,10vw,140px)}
.clist{border-top:1px solid var(--line);margin-top:40px}
.crow{position:relative;display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:20px;width:100%;padding-block:clamp(16px,2.4vw,30px);border-bottom:1px solid var(--line);text-align:start;transition:padding .6s var(--ease),color .4s}
.crow .n{font-size:13px;color:var(--dim)}
.crow>span{min-width:0}
.crow .t{overflow-wrap:break-word;font-size:clamp(30px,6.4vw,104px);font-weight:800;font-stretch:125%;text-transform:uppercase;line-height:.95;letter-spacing:-.02em;transition:transform .7s var(--ease),color .4s}
html[dir="rtl"] .crow .t{font-size:clamp(30px,5vw,76px)}
.crow .ar{font-size:30px;transition:transform .6s var(--ease)}
.crow:hover .t{transform:translateX(18px);color:var(--gold-hi)}
html[dir="rtl"] .crow:hover .t{transform:translateX(-18px)}
.crow:hover .ar{transform:rotate(-45deg)}
.clist:hover .crow:not(:hover) .t{color:rgba(236,228,212,.25)}
#cfloat{position:fixed;top:0;left:0;z-index:30;width:300px;aspect-ratio:4/5;pointer-events:none;overflow:hidden;clip-path:inset(50% 50% 50% 50%);transition:clip-path .6s var(--ease)}
#cfloat.on{clip-path:inset(0)}
#cfloat img{width:100%;height:100%;object-fit:cover}
@media (hover:none){#cfloat{display:none}.crow{grid-template-columns:44px 1fr auto}}

/* shop */
#shop{padding-block:40px 120px}
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:34px}
.shead h2{margin:0;font-size:clamp(46px,7.6vw,128px);font-weight:900;font-stretch:125%;text-transform:uppercase;line-height:.85;letter-spacing:-.02em}
.tabs{display:flex;flex-wrap:wrap;gap:6px 26px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:18px;align-items:center}
.tabs button{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;font-stretch:110%;color:var(--dim)}
html[dir="rtl"] .tabs button{letter-spacing:0;font-size:15px}
.tabs button.on,.tabs button:hover{color:var(--bone)}
.tabs sup{font-size:10px;margin-inline-start:3px;color:var(--gold)}
.tabs .sp{flex:1}
.tabs select{background:transparent;border:0;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--bone);font-stretch:110%;cursor:pointer;outline:none}
.tabs select option{background:var(--ink-2)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-inline-start:1px solid var(--line)}
.card{position:relative;border-inline-end:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 14px 20px;display:flex;flex-direction:column;gap:14px;min-width:0;cursor:pointer}
.card .ph{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--ink-2)}
.card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:transform 1.2s var(--ease),opacity .6s}
.card .ph img.b{opacity:0}
.card:hover .ph img.a{transform:scale(1.07)}
.card:hover .ph img.b{opacity:1}
.card .ph::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(236,228,212,.06);background:linear-gradient(to top,rgba(11,10,8,.28),transparent 40%)}
.card .tagl{position:absolute;top:12px;inset-inline-start:12px;z-index:2;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;background:var(--ink);padding:5px 9px;font-stretch:110%}
.card .tagl.g{background:var(--gold);color:var(--ink)}
.card .qv{position:absolute;left:0;right:0;bottom:0;z-index:2;background:var(--bone);color:var(--ink);text-align:center;padding:13px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;transform:translateY(101%);transition:transform .5s var(--ease)}
.card:hover .qv{transform:none}
.card .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.card .nm{font-weight:600;font-size:15px;line-height:1.3}
.card .pr{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.card .pr s{color:var(--dim);font-weight:400;margin-inline-end:6px}
.card .br{font-size:13px;color:var(--dim)}
.card.oos .ph img{filter:grayscale(1) brightness(.6)}
@media (max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:10px 10px 16px}.card .nm{font-size:14px}}
@media (hover:none){.card .qv{display:none}}
.empty{grid-column:1/-1;padding:80px 20px;text-align:center;border-inline-end:1px solid var(--line);border-bottom:1px solid var(--line)}

/* legends */
#legends{padding-block:clamp(90px,12vw,170px);border-top:1px solid var(--line)}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:6vw;align-items:start}
.lg .stick{position:sticky;top:120px}
.lg h2{margin:0 0 26px;font-size:clamp(52px,8vw,138px);font-weight:900;font-stretch:125%;text-transform:uppercase;line-height:.84;letter-spacing:-.025em}
.lg h2 .it{display:block;font-size:.72em;color:var(--gold);text-transform:none;letter-spacing:-.01em;line-height:1}
.lg p{max-width:38ch;color:var(--dim);font-size:17px;margin:0 0 30px}
.lcol{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.lcol figure{margin:0;cursor:pointer}
.lcol figure:nth-child(even){margin-top:120px}
.lcol .fr{overflow:hidden;aspect-ratio:4/5;background:var(--ink-2)}
.lcol img{width:100%;height:100%;object-fit:contain;will-change:transform}
.lcol figcaption{display:flex;justify-content:space-between;gap:10px;padding-top:12px;font-size:14px}
@media (max-width:860px){.lg{grid-template-columns:1fr}.lg .stick{position:static}.lcol figure:nth-child(even){margin-top:50px}}

/* service */
.svc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.svc div{padding:34px 26px 40px 0;border-inline-end:1px solid var(--line);padding-inline-start:26px}
.svc div:first-child{padding-inline-start:0}
.svc div:last-child{border:0}
.svc b{display:block;font-size:18px;font-weight:600;margin:14px 0 8px}
.svc p{margin:0;color:var(--dim);font-size:15px}
@media (max-width:860px){.svc{grid-template-columns:1fr 1fr}.svc div{padding:26px 16px!important;border-bottom:1px solid var(--line)}.svc div:nth-child(2n){border-inline-end:0}}

/* footer */
footer{border-top:1px solid var(--line);padding-top:90px;padding-bottom:calc(30px + env(safe-area-inset-bottom,0px));overflow:hidden}
.fcols{display:grid;grid-template-columns:2fr 1fr 1fr 1.2fr;gap:30px}
.fcols h5{margin:0 0 16px;color:var(--dim)}
.fcols ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.fcols li button,.fcols li a{color:var(--bone)}
.fbig{font-size:clamp(32px,4.4vw,64px);font-weight:800;font-stretch:125%;text-transform:uppercase;line-height:.95;margin:0 0 26px;letter-spacing:-.02em}
.fmono{margin-top:90px;display:flex;justify-content:center}
.fmono .ko{width:min(560px,80vw);height:auto;opacity:.95}
.legal{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:60px;padding-top:22px;border-top:1px solid var(--line);font-size:13px;color:var(--dim)}

@media (max-width:860px){.bstage{place-items:center}#bsvg{width:min(100%,60vh)!important}.bw{grid-template-columns:1fr;grid-template-rows:auto 1fr;align-content:start;padding-top:110px}.btxt h2{font-size:clamp(40px,11vw,64px);margin:10px 0 12px}.btxt p{font-size:15px}.bbuy{margin-top:18px}.blab{display:none}#bsvg{width:min(100%,60vh)}.bprog{display:none}}
/* scene: store to door */
#deliver{position:relative;height:100svh;min-height:600px;overflow:hidden;border-top:1px solid var(--line);background:radial-gradient(120% 70% at 50% 110%,#17130d,var(--ink) 60%)}

#cur{position:fixed;top:0;left:0;z-index:150;pointer-events:none;width:0;height:0}

.rip{position:fixed;z-index:149;pointer-events:none;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:1px solid var(--gold);animation:rip .7s var(--ease) forwards}

@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}#pre{display:none}}

  let m="M0,520";for(let x=0;x<=2400;x+=80){m+=` L${x},${(470+Math.sin(x/170)*38+Math.sin(x/53)*12).toFixed(0)}`}

function fracAtX(x){const r=$("#road"),L=r.getTotalLength();let lo=0,hi=1;for(let i=0;i<30;i++){const m=(lo+hi)/2;if(r.getPointAtLength(L*m).x<x)lo=m;else hi=m}return lo}
function setCam(vx){
  const svg=$("#dsvg"),vw=svg.clientWidth||innerWidth,vh=svg.clientHeight||innerHeight;
  let H=980,W=H*vw/vh;if(W<760){W=760;H=W*vh/vw}

let lenis=null,ctx=null;
function initMotion(){

  if(ctx)ctx.revert();
  const rtl=document.documentElement.dir==="rtl";
  ctx=gsap.context(()=>{
    // hero: shoe drifts and turns on scroll, wordmark spreads
    gsap.to("#wall",{scale:1.35,yPercent:12,opacity:.35,ease:"none",scrollTrigger:{trigger:"#hero",start:"top top",end:"bottom top",scrub:true}});
    gsap.to("#hmono",{yPercent:-40,scale:.7,opacity:0,ease:"none",scrollTrigger:{trigger:"#hero",start:"top top",end:"70% top",scrub:true}});

    gsap.to(".htop",{yPercent:-60,opacity:0,ease:"none",scrollTrigger:{trigger:"#hero",start:"top top",end:"40% top",scrub:true}});
    // statement words light up

    mm.add("(min-width: 821px)",()=>{
      const tr=$("#dtrack");
      const dist=()=>Math.max(0,tr.scrollWidth-window.innerWidth+parseFloat(getComputedStyle(document.documentElement).fontSize)*2);
      const slides=$$("#dtrack .slide");
      gsap.set(tr,{paddingInlineStart:"max(20px, env(safe-area-inset-left, 0px))",paddingInlineEnd:"20vw"});
      gsap.to(tr,{x:()=>(rtl?1:-1)*dist(),ease:"none",scrollTrigger:{trigger:"#drop",start:"top top",end:()=>"+="+dist(),pin:true,scrub:.6,invalidateOnRefresh:true,onUpdate:s=>{
        const i=Math.min(slides.length,1+Math.floor(s.progress*slides.length*.999));$("#dCount").textContent=`${pad(i)} / ${pad(slides.length)}`;$("#dprog").style.width=(s.progress*100)+"%"}}});
      slides.forEach(sl=>{const im=sl.querySelector("img");gsap.fromTo(im,{rotate:-8},{rotate:6,ease:"none",scrollTrigger:{trigger:"#drop",start:"top top",end:()=>"+="+dist(),scrub:true}})});
    });
