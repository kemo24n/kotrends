<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KO Trends · Owner</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B0A08">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap">
<style>
:root{--ink:#0B0A08;--ink-2:#12100D;--ink-3:#1A1713;--bone:#ECE4D4;--dim:#8E8676;--line:rgba(236,228,212,.12);--line-2:rgba(236,228,212,.22);--gold:#C99A52;--gold-hi:#EBC98C;--red:#E2735A;--green:#7CC58A;--blue:#8FB3E0;
--f:"Archivo","Helvetica Neue",Arial,sans-serif;--gx:max(16px,env(safe-area-inset-left,0px));--gy:max(16px,env(safe-area-inset-right,0px));color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0;padding:0}a{color:inherit}
:focus-visible{outline:1px solid var(--gold);outline-offset:2px}
.cap{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;font-stretch:110%}
.dim{color:var(--dim)}.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border:1px solid var(--line-2);border-radius:999px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;font-stretch:110%;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--bone)}.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}.btn.gold:hover{background:var(--gold-hi)}
.btn.danger{color:var(--red);border-color:rgba(226,115,90,.4)}.btn[disabled]{opacity:.4;pointer-events:none}.btn.sm{height:34px;padding:0 12px;font-size:11px}
.ko{display:block}.ko use{fill:url(#koGold) #D9AE68}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
.lbox{width:min(380px,100%);display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center}
.lbox .ko{width:110px;height:auto}
.lbox h1{margin:0;font-size:28px;font-weight:800;font-stretch:125%;text-transform:uppercase;letter-spacing:-.01em}
.inp{width:100%;background:var(--ink-2);border:1px solid var(--line-2);border-radius:12px;padding:13px 14px;outline:none}
.inp:focus{border-color:var(--gold)}
.err{color:var(--red);font-size:14px;min-height:1px;margin:0}
/* app */
header{position:sticky;top:0;z-index:20;background:rgba(11,10,8,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) var(--gy) 10px var(--gx);display:flex;align-items:center;gap:14px}
header .ko{width:34px;height:28px;flex:none}
header h1{margin:0;font-size:15px;font-weight:800;font-stretch:125%;letter-spacing:.08em;text-transform:uppercase;flex:1;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
main{padding:18px var(--gy) 90px var(--gx);max-width:1180px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi b{display:block;font-size:26px;font-weight:800;font-stretch:115%;line-height:1.15}
.kpi.warn b{color:var(--gold-hi)}
@media (max-width:640px){.kpis{grid-template-columns:1fr 1fr}}
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tabs button{padding:12px 14px;border-bottom:2px solid transparent;font-weight:600;color:var(--dim)}
.tabs button.on{color:var(--bone);border-color:var(--gold)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--gold);color:var(--ink);font-size:11px;font-weight:800;padding:0 6px;margin-inline-start:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.toolbar .inp{flex:1;min-width:180px;padding:10px 14px}
/* orders */
.ord{background:var(--ink-2);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;display:grid;gap:12px}
.ord.st-New{border-color:rgba(201,154,82,.55)}
.oh{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.oh b{font-size:17px;font-weight:800;font-stretch:115%}
.sel{background:var(--ink-3);border:1px solid var(--line-2);border-radius:10px;padding:8px 10px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--ink-3)}
.pill.New{background:rgba(201,154,82,.18);color:var(--gold-hi)}.pill.Confirmed{background:rgba(143,179,224,.15);color:var(--blue)}
.pill.Out{background:rgba(143,179,224,.15);color:var(--blue)}.pill.Delivered{background:rgba(124,197,138,.15);color:var(--green)}.pill.Cancelled{background:rgba(226,115,90,.15);color:var(--red)}
.ocust{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start}
.oacts{display:flex;gap:6px;flex-wrap:wrap}
.oitems{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px}
.oline{display:flex;justify-content:space-between;gap:12px}
.otot{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;font-weight:700}
.empty{padding:50px 20px;text-align:center;color:var(--dim);border:1px dashed var(--line-2);border-radius:16px}
/* products */
.plist{display:grid;gap:8px}
.prow{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:8px 12px 8px 8px;text-align:start;width:100%}
.prow:hover{border-color:var(--line-2)}
.prow img{width:56px;height:70px;object-fit:contain;background:var(--ink-3);border-radius:8px}
.prow .nm{font-weight:600;line-height:1.3}
.prow .rt{text-align:end;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.stk{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ink-3)}
.stk.low{color:var(--gold-hi)}.stk.zero{color:var(--red)}.hid{opacity:.45}
/* editor */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40}
.ed{position:fixed;top:0;bottom:0;right:0;width:min(560px,100vw);z-index:50;background:var(--ink-2);border-left:1px solid var(--line);display:flex;flex-direction:column}
.edh{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 14px;border-bottom:1px solid var(--line)}
.edb{flex:1;overflow:auto;padding:18px;display:grid;gap:14px;align-content:start}
.edf{padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.fld{display:grid;gap:6px}.fld label{font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.04em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
textarea.inp{min-height:84px;resize:vertical}
.szchips{display:flex;flex-wrap:wrap;gap:6px}
.szchips button{min-width:48px;height:38px;border:1px solid var(--line-2);border-radius:10px;font-weight:600}
.szchips button.out{background:rgba(226,115,90,.15);border-color:rgba(226,115,90,.6);color:var(--red);text-decoration:line-through}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:4/5;background:var(--ink-3);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain}
.ph .main{position:absolute;left:6px;top:6px;background:var(--gold);color:var(--ink);font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px}
.ph .acts{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;background:linear-gradient(transparent,rgba(0,0,0,.8));padding:14px 4px 4px}
.ph .acts button{width:26px;height:26px;border-radius:50%;background:rgba(11,10,8,.8);font-size:13px}
.addph{display:grid;place-items:center;aspect-ratio:4/5;border:1px dashed var(--line-2);border-radius:10px;color:var(--dim);font-size:13px;text-align:center;cursor:pointer;padding:8px}
.addph:hover{border-color:var(--gold);color:var(--gold-hi)}
.tog{display:flex;align-items:center;gap:10px;cursor:pointer}
.tog input{width:20px;height:20px;accent-color:var(--gold)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,calc(100% + 40px));visibility:hidden;background:var(--bone);color:var(--ink);padding:12px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:90;transition:transform .35s,visibility .35s;max-width:calc(100vw - 32px);text-align:center}
.toast.on{transform:translate(-50%,0);visibility:visible}
@media(max-width:560px){header h1 .o{display:none}header{gap:8px}header .btn.sm{padding:0 12px;letter-spacing:.06em}}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>
</head>

<section id="login" hidden>
  <form class="lbox" id="loginF">
    <svg class="ko" viewBox="270 415 2015 1650"><use href="#koPath"/></svg>
    <h1>Owner panel</h1>
    <p class="dim" style="margin:0">Log in to manage orders, stock and products.</p>
    <input class="inp" id="pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password">
    <p class="err" id="lerr" role="alert"></p>
    <button class="btn gold" style="width:100%" type="submit">Log in</button>
    <a class="dim" href="/" style="font-size:13px">Back to the store</a>
  </form>
</section>

<section id="app" hidden>
  <header>
    <svg class="ko" viewBox="270 415 2015 1650"><use href="#koPath"/></svg>
    <h1>KO Trends<span class="o"> · Owner</span></h1>
    <a class="btn sm" href="/" target="_blank" rel="noopener">View store</a>
    <button class="btn sm" id="logout">Log out</button>
  </header>
  <main>
    <div class="kpis" id="kpis"></div>
    <div class="tabs"><button class="on" data-tab="orders">Orders<span class="badge" id="newN" hidden></span></button><button data-tab="products">Products</button></div>
    <div id="vOrders">
      <div class="chips" id="ofilter"></div>
      <div id="olist"></div>
    </div>
    <div id="vProducts" hidden>
      <div class="toolbar"><input class="inp" id="pq" placeholder="Search products" aria-label="Search products"><button class="btn gold" id="addP">+ Add product</button></div>
      <div class="chips" id="pfilter"></div>
      <div class="plist" id="plist"></div>
    </div>
  </main>
</section>

<div class="veil" id="veil" hidden></div>
<aside class="ed" id="ed" hidden aria-label="Edit product"></aside>
<input type="file" id="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
<div class="toast" id="toast" role="status"></div>

<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"$"+(Math.round((n||0)*100)/100).toLocaleString("en-US",{maximumFractionDigits:2});
const CATS=[["sneakers","Sneakers"],["hoops","Basketball shoes"],["jerseys","NBA jerseys"],["football","Football"],["tees","Tees & tanks"],["bottoms","Shorts & pants"],["slides","Slides"]];
const SHOE=["40","41","42","43","44","45","46"],APP=["S","M","L","XL","XXL"];
const STATUSES=["New","Confirmed","Out for delivery","Delivered","Cancelled"];
let products=[],orders=[],stats={},ofilter="",pfilter="all",editing=null,confirmDel=false;
let tt;const toast=m=>{const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),2600)};

async function api(path,opt={}){
  const r=await fetch(path,{credentials:"same-origin",...opt,headers:{...(opt.body&&!(opt.body instanceof FormData)?{"content-type":"application/json"}:{}),...(opt.headers||{})}});
  let d={};try{d=await r.json()}catch(e){}
  if(r.status===401&&path!=="/api/admin/login"){show("login");throw new Error("Please log in")}
  if(!r.ok)throw new Error(d.error||"Something went wrong ("+r.status+")");
  return d;
}
function show(v){$("#login").hidden=v!=="login";$("#app").hidden=v!=="app";if(v==="login")setTimeout(()=>$("#pw").focus(),50)}

/* ---------- login ---------- */
$("#loginF").addEventListener("submit",async e=>{
  e.preventDefault();$("#lerr").textContent="";
  try{await api("/api/admin/login",{method:"POST",body:JSON.stringify({password:$("#pw").value})});$("#pw").value="";show("app");loadAll()}
  catch(err){$("#lerr").textContent=err.message}
});
$("#logout").addEventListener("click",async()=>{await api("/api/admin/login",{method:"DELETE"}).catch(()=>{});show("login")});

/* ---------- data ---------- */
async function loadOrders(){const d=await api("/api/admin/orders");orders=d.orders;stats=d.stats;renderKpis();renderOrders()}
async function loadProducts(){products=await api("/api/admin/products");renderProducts();renderKpis()}
async function loadAll(){try{await Promise.all([loadOrders(),loadProducts()])}catch(e){if(e.message!=="Please log in")toast(e.message)}}

function renderKpis(){
  $("#kpis").innerHTML=`<div class="kpi"><span class="cap dim">Orders today</span><b class="num">${stats.today||0}</b></div>
  <div class="kpi ${stats.open?"warn":""}"><span class="cap dim">To handle</span><b class="num">${stats.open||0}</b></div>
  <div class="kpi"><span class="cap dim">Revenue</span><b class="num">${money(stats.revenue)}</b></div>
  <div class="kpi ${stats.low?"warn":""}"><span class="cap dim">Low stock</span><b class="num">${stats.low||0}</b></div>`;
  const n=orders.filter(o=>o.status==="New").length;$("#newN").hidden=!n;$("#newN").textContent=n;
}

/* ---------- orders ---------- */
function renderOrders(){
  const counts=Object.fromEntries(STATUSES.map(s=>[s,orders.filter(o=>o.status===s).length]));
  $("#ofilter").innerHTML=[["","All",orders.length],...STATUSES.map(s=>[s,s,counts[s]])].map(([v,n,c])=>`<button class="chip${ofilter===v?" on":""}" data-of="${v}">${n} <span class="num" style="opacity:.6">${c}</span></button>`).join("");
  const list=orders.filter(o=>!ofilter||o.status===ofilter);
  $("#olist").innerHTML=list.length?list.map(o=>{
    const digits=(o.phone.match(/\d/g)||[]).join("");const wa=digits.startsWith("00")?digits.slice(2):digits;
    const when=new Date(o.created_at.replace(" ","T")+"Z");
    return `<article class="ord st-${o.status.split(" ")[0]}">
      <div class="oh"><div><b>${esc(o.code)}</b> <span class="dim" style="font-size:13px">${when.toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}</span></div>
        <select class="sel" data-os="${o.id}" aria-label="Status">${STATUSES.map(s=>`<option${o.status===s?" selected":""}>${s}</option>`).join("")}</select></div>
      <div class="ocust"><div><b style="font-weight:600">${esc(o.name||"No name")}</b><br><span class="num">${esc(o.phone)}</span><br><span class="dim">${o.country==="SY"?"Syria":"Lebanon"}, ${esc(o.city)}${o.address?" · "+esc(o.address):""}</span>${o.notes?`<br><span class="dim">Note: ${esc(o.notes)}</span>`:""}</div>
        <div class="oacts"><a class="btn sm" href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp</a><a class="btn sm" href="tel:${esc(o.phone)}">Call</a></div></div>
      <div class="oitems">${o.items.map(l=>`<div class="oline"><span>${esc(l.name)} <span class="dim">· ${l.size==="?"?"<b style='color:var(--gold-hi)'>size to confirm</b>":"size "+esc(l.size)} × ${l.qty}${l.fit?` · ${esc(l.fit)}`:""}</span></span><span class="num">${money(l.price*l.qty)}</span></div>`).join("")}</div>
      <div class="dim" style="font-size:13px">${esc(o.payment)} · subtotal ${money(o.subtotal)}${o.discount?` · discount −${money(o.discount)}${o.promo?" ("+esc(o.promo)+")":""}`:""} · delivery ${money(o.delivery)}</div>
      <div class="otot"><span>Total</span><span class="num">${money(o.total)}</span></div>
    </article>`}).join(""):`<div class="empty">${orders.length?"No orders with this status.":"No orders yet. New orders from the website appear here."}</div>`;
}

/* ---------- products ---------- */
function renderProducts(){
  const q=$("#pq").value.trim().toLowerCase();
  $("#pfilter").innerHTML=[["all","All"],["low","Low stock"],["hidden","Hidden"],...CATS].map(([v,n])=>`<button class="chip${pfilter===v?" on":""}" data-pf="${v}">${n}</button>`).join("");
  const list=products.filter(p=>(!q||(p.name+" "+p.brand).toLowerCase().includes(q))&&(pfilter==="all"||(pfilter==="low"?p.stock<=3:pfilter==="hidden"?p.hidden:p.cat===pfilter)));
  $("#plist").innerHTML=list.length?list.map(p=>`<button class="prow${p.hidden?" hid":""}" data-edit="${p.id}"><img src="${esc(p.img[0]||"")}" alt="" loading="lazy">
    <div style="min-width:0"><div class="nm">${esc(p.name)}</div><div class="dim" style="font-size:13px">${esc(p.brand)} · ${(CATS.find(c=>c[0]===p.cat)||[])[1]||p.cat}${p.hidden?" · hidden":""}</div></div>
    <div class="rt"><b class="num">${money(p.price)}</b><span class="stk ${p.stock<=0?"zero":p.stock<=3?"low":""}">${p.stock<=0?"Sold out":p.stock+" in stock"}</span></div></button>`).join(""):`<div class="empty">No products here.</div>`;
}

function openEditor(p){
  confirmDel=false;
  editing=p?JSON.parse(JSON.stringify(p)):{id:"",name:"",brand:"",cat:"sneakers",price:"",was:0,sizes:[...SHOE],out:[],stock:10,tag:"new",color:"",desc:"",img:[],hidden:false};
  renderEditor();$("#veil").hidden=false;$("#ed").hidden=false;document.body.style.overflow="hidden";
}
function closeEditor(){$("#veil").hidden=true;$("#ed").hidden=true;document.body.style.overflow="";editing=null}
function renderEditor(){
  const p=editing;
  $("#ed").innerHTML=`<div class="edh"><b>${p.id?"Edit product":"New product"}</b><button class="btn sm" data-close>Close</button></div>
  <div class="edb">
    <div class="fld"><label>Photos (first one is the main photo)</label><div class="photos">${p.img.map((s,i)=>`<div class="ph"><img src="${esc(s)}" alt="">${i?"":'<span class="main">MAIN</span>'}<div class="acts"><button data-mv="${i}" data-d="-1" aria-label="Move left">←</button><button data-rm="${i}" aria-label="Remove">✕</button><button data-mv="${i}" data-d="1" aria-label="Move right">→</button></div></div>`).join("")}<button class="addph" id="addPh">+ Add photos<br><span style="font-size:11px">JPG, PNG or WEBP</span></button></div></div>
    <div class="fld"><label for="eName">Name</label><input class="inp" id="eName" value="${esc(p.name)}" placeholder="e.g. Jordan 1 Mid Chicago"></div>
    <div class="two"><div class="fld"><label for="eBrand">Brand</label><input class="inp" id="eBrand" value="${esc(p.brand)}" placeholder="Nike"></div>
      <div class="fld"><label for="eCat">Category</label><select class="inp" id="eCat">${CATS.map(([v,n])=>`<option value="${v}"${p.cat===v?" selected":""}>${n}</option>`).join("")}</select></div></div>
    <div class="three"><div class="fld"><label for="ePrice">Price $</label><input class="inp" id="ePrice" type="number" min="1" step="0.5" value="${esc(p.price)}"></div>
      <div class="fld"><label for="eWas">Old price $ (sale)</label><input class="inp" id="eWas" type="number" min="0" step="0.5" value="${p.was||""}" placeholder="optional"></div>
      <div class="fld"><label for="eStock">Stock</label><input class="inp" id="eStock" type="number" min="0" value="${p.stock}"></div></div>
    <div class="fld"><label for="eSizes">Sizes (comma separated)</label><input class="inp" id="eSizes" value="${esc(p.sizes.join(", "))}"><div class="szchips" style="margin-top:4px">${p.sizes.map(s=>`<button class="${p.out.includes(s)?"out":""}" data-out="${esc(s)}" title="Tap to mark sold out">${esc(s)}</button>`).join("")}</div><span class="dim" style="font-size:12px">Tap a size to mark it sold out.</span></div>
    <div class="two"><div class="fld"><label for="eColor">Colour</label><input class="inp" id="eColor" value="${esc(p.color)}" placeholder="White / Red"></div>
      <div class="fld"><label for="eTag">Badge</label><select class="inp" id="eTag"><option value=""${!p.tag?" selected":""}>None</option><option value="new"${p.tag==="new"?" selected":""}>New</option></select></div></div>
    <div class="fld"><label for="eDesc">Description</label><textarea class="inp" id="eDesc">${esc(p.desc)}</textarea></div>
    <label class="tog"><input type="checkbox" id="eVis" ${p.hidden?"":"checked"}> Show on the website</label>
    <p class="err" id="eErr" role="alert"></p>
  </div>
  <div class="edf">${p.id?(confirmDel?`<span class="confirm">Delete this product? <button class="btn sm danger" id="delYes">Delete</button><button class="btn sm" id="delNo">Keep</button></span>`:`<button class="btn danger" id="delP">Delete</button>`):"<span></span>"}<button class="btn gold" id="saveP">${p.id?"Save changes":"Add product"}</button></div>`;
}
function readEditor(){
  const p=editing;
  p.name=$("#eName").value.trim();p.brand=$("#eBrand").value.trim();
  const newCat=$("#eCat").value;
  p.price=+$("#ePrice").value;p.was=+$("#eWas").value||0;p.stock=Math.max(0,parseInt($("#eStock").value)||0);
  const sizes=$("#eSizes").value.split(",").map(s=>s.trim()).filter(Boolean);
  if(newCat!==p.cat&&!p.id&&$("#eSizes").value===(["sneakers","hoops","slides"].includes(p.cat)?SHOE:APP).join(", "))p.sizes=["sneakers","hoops","slides"].includes(newCat)?[...SHOE]:[...APP];else p.sizes=sizes;
  p.cat=newCat;p.out=p.out.filter(s=>p.sizes.includes(s));
  p.color=$("#eColor").value.trim();p.tag=$("#eTag").value;p.desc=$("#eDesc").value.trim();p.hidden=!$("#eVis").checked;
}

/* photo upload: resized in the browser, then stored in Cloudflare R2 */
function resize(file){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const m=1400,s=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(new Error("Could not read photo")),"image/webp",.86);URL.revokeObjectURL(im.src)};im.onerror=()=>no(new Error("Could not read photo"));im.src=URL.createObjectURL(file)})}
$("#file").addEventListener("change",async e=>{
  const files=[...e.target.files];e.target.value="";if(!files.length||!editing)return;
  readEditor();
  for(const f of files){
    toast(`Uploading ${files.indexOf(f)+1} of ${files.length}…`);
    try{const b=await resize(f);const fd=new FormData();fd.append("file",new File([b],"photo.webp",{type:"image/webp"}));const d=await api("/api/admin/upload",{method:"POST",body:fd});editing.img.push(d.url);renderEditor()}
    catch(err){toast(err.message)}
  }
  toast("Photos added. Press Save to keep them.");
});

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const g=s=>e.target.closest(s);let el;
  if(el=g("[data-tab]")){$$("[data-tab]").forEach(b=>b.classList.toggle("on",b===el));$("#vOrders").hidden=el.dataset.tab!=="orders";$("#vProducts").hidden=el.dataset.tab!=="products";return}
  if(el=g("[data-of]")){ofilter=el.dataset.of;renderOrders();return}
  if(el=g("[data-pf]")){pfilter=el.dataset.pf;renderProducts();return}
  if(el=g("[data-edit]")){openEditor(products.find(p=>p.id===el.dataset.edit));return}
  if(g("#addP")){openEditor(null);return}
  if(g("[data-close]")||g("#veil")){closeEditor();return}
  if(g("#addPh")){$("#file").click();return}
  if(el=g("[data-rm]")){readEditor();editing.img.splice(+el.dataset.rm,1);renderEditor();return}
  if(el=g("[data-mv]")){readEditor();const i=+el.dataset.mv,j=i+ +el.dataset.d;if(j<0||j>=editing.img.length)return;[editing.img[i],editing.img[j]]=[editing.img[j],editing.img[i]];renderEditor();return}
  if(el=g("[data-out]")){readEditor();const s=el.dataset.out;editing.out=editing.out.includes(s)?editing.out.filter(x=>x!==s):[...editing.out,s];renderEditor();return}
  if(g("#delP")){readEditor();confirmDel=true;renderEditor();return}
  if(g("#delNo")){readEditor();confirmDel=false;renderEditor();return}
  if(g("#delYes")){try{await api("/api/admin/products?id="+encodeURIComponent(editing.id),{method:"DELETE"});closeEditor();toast("Product deleted");loadProducts()}catch(err){toast(err.message)}return}
  if(el=g("#saveP")){
    readEditor();const p=editing;$("#eErr").textContent="";
    if(!p.name)return $("#eErr").textContent="Add a product name.";
    if(!(p.price>0))return $("#eErr").textContent="Add a price.";
    if(!p.img.length)return $("#eErr").textContent="Add at least one photo.";
    if(!p.sizes.length)return $("#eErr").textContent="Add at least one size.";
    el.disabled=true;
    try{await api("/api/admin/products",{method:p.id?"PUT":"POST",body:JSON.stringify(p)});closeEditor();toast(p.id?"Saved. The website is updated.":"Product added to the website.");loadProducts()}
    catch(err){$("#eErr").textContent=err.message;el.disabled=false}
    return}
});
document.addEventListener("change",async e=>{
  const el=e.target;
  if(el.dataset.os){try{await api("/api/admin/orders",{method:"PATCH",body:JSON.stringify({id:+el.dataset.os,status:el.value})});toast("Order updated");await loadOrders();if(el.value==="Cancelled")loadProducts()}catch(err){toast(err.message)}}
});
$("#pq").addEventListener("input",renderProducts);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&editing)closeEditor()});
setInterval(()=>{if(!$("#app").hidden&&document.visibilityState==="visible")loadOrders().catch(()=>{})},30000);

/* boot: try the session, otherwise show login */
api("/api/admin/orders").then(d=>{orders=d.orders;stats=d.stats;show("app");renderKpis();renderOrders();loadProducts()}).catch(()=>show("login"));
})();
</script>
